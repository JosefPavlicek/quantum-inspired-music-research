[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonix-research"
version = "0.1.0"
description = "HARMONIX: explainable human-aware harmonic decision research"
requires-python = ">=3.11"
dependencies = ["music21>=9,<10", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
harmonix = "harmonix.cli:main"

[tool.setuptools.packages.find]
include = ["harmonix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
